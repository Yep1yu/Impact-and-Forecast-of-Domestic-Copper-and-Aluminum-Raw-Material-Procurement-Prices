name: Daily price update

on:
  schedule:
    # Asia/Shanghai 10:30, 11:30, 14:30 and 16:30, Monday through Friday.
    - cron: "30 2 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  update-dashboard-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare isolated database copy
        run: |
          mkdir -p .tmp
          cp domestic_procurement_prices.sqlite .tmp/dashboard-update.sqlite

      - name: Fetch prices and rebuild forecasts
        env:
          PYTHONUNBUFFERED: "1"
        run: >
          python update_hybrid_price_database.py
          --database .tmp/dashboard-update.sqlite
          --current-only
          --monthly-workbook "monthly_price_prediction_outputs/drop_limited_vars/引入变量结果分析.xlsx"

      - name: Fetch GFEX lithium prices and rebuild lithium forecasts
        env:
          PYTHONUNBUFFERED: "1"
        run: >
          python update_gfex_lithium.py
          --database .tmp/dashboard-update.sqlite

      - name: Validate and publish database
        run: |
          python scripts/verify_dashboard_database.py .tmp/dashboard-update.sqlite
          mv .tmp/dashboard-update.sqlite domestic_procurement_prices.sqlite

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domestic_procurement_prices.sqlite ccmn_changjiang_avg_prices.csv ccmn_changjiang_avg_prices_tax_exclusive.csv daily_ensemble_*.csv daily_ensemble_*.json daily_hybrid_*.csv daily_hybrid_*.json monthly_price_prediction_outputs
          git add lithium_carbonate_prediction_outputs/lithium_daily_history.csv
          git add lithium_carbonate_prediction_outputs/lithium_daily_forecast.csv
          git add lithium_carbonate_prediction_outputs/lithium_monthly_features.csv
          git add lithium_carbonate_prediction_outputs/lithium_monthly_fitted_prices.csv
          git add lithium_carbonate_prediction_outputs/lithium_monthly_forecast.csv
          git add lithium_carbonate_prediction_outputs/lithium_monthly_model_coefficients.csv
          git add lithium_carbonate_prediction_outputs/lithium_forecast_driver_contributions.csv
          git add lithium_carbonate_prediction_outputs/lithium_variable_forecast_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Update daily procurement price data"
          git push
