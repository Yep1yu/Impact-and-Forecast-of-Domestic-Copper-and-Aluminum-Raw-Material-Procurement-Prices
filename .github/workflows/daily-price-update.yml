name: Daily price update

on:
  schedule:
    # 09:00 Asia/Shanghai (UTC+8), Monday through Friday.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices and rebuild forecasts
        env:
          CCMN_COOKIE: ${{ secrets.CCMN_COOKIE }}
        run: >
          python update_hybrid_price_database.py
          --monthly-workbook "monthly_price_prediction_outputs/drop_limited_vars/引入变量结果分析.xlsx"

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domestic_procurement_prices.sqlite ccmn_changjiang_avg_prices.csv ccmn_changjiang_avg_prices_tax_exclusive.csv daily_ensemble_*.csv daily_ensemble_*.json daily_hybrid_*.csv daily_hybrid_*.json monthly_price_prediction_outputs
          git diff --cached --quiet || git commit -m "Update daily procurement price data"
          git push
