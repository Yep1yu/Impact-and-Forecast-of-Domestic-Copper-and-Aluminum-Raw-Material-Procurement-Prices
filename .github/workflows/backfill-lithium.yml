name: One-time lithium price backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "开始日期（YYYY-MM-DD）"
        required: true
        default: "2026-07-15"
      end:
        description: "结束日期（YYYY-MM-DD）"
        required: true
        default: "2026-08-04"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill lithium prices
        env:
          CCMN_COOKIE: ${{ secrets.CCMN_COOKIE }}
        run: >
          python scripts/backfill_ccmn_lithium.py
          --start "${{ inputs.start }}"
          --end "${{ inputs.end }}"

      - name: Validate database
        run: python scripts/verify_dashboard_database.py domestic_procurement_prices.sqlite

      - name: Commit backfilled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domestic_procurement_prices.sqlite
          git diff --cached --quiet && exit 0
          git commit -m "Backfill CCMN lithium prices"
          git push
